[package]
name = "iowebsite"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "iowebsite static frontend host and Bilibili live-status proxy"
publish = false

[lib]
name = "iowebsite_backend"
path = "src/lib.rs"

[[bin]]
name = "iowebsite"
path = "src/main.rs"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["clock", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
